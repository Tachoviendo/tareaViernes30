<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ this.authService.user()?.username || 'Anónimo' }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div
        class="ion-display-flex ion-flex-column ion-justify-content-between"
        style="height: 100%"
      >
        <!-- Sección superior: Enlaces de navegación -->
        <ion-list lines="none">
          <ion-menu-toggle>
            <ion-item [routerLink]="['/home']" routerLinkActive="menu-activo">
              <ion-icon name="home-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>Home</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle>
            <ion-item [routerLink]="['/foto']" routerLinkActive="menu-activo">
              <ion-icon name="image-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>Foto</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle>
            <ion-item [routerLink]="['/usuarios']" routerLinkActive="menu-activo">
              <ion-icon name="people-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>Usuarios</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle>
            <ion-item [routerLink]="['/tareas']" detail="true" routerLinkActive="menu-activo">
              <ion-icon name="checkbox-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-label>
                <h3>Tareas</h3>
                <p>Trabajar con las tareas existentes</p>
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        @if (this.authService.user()) {
          <ion-list lines="none">
            <ion-menu-toggle>
              <ion-item button (click)="logout()" color="danger">
                <ion-icon name="log-out-outline" slot="start" aria-hidden="true"></ion-icon>
                <ion-label>Cerrar Sesión</ion-label>
              </ion-item>
            </ion-menu-toggle>
          </ion-list>
        }
      </div>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      @for (noti of this.notificationService.notifications(); track noti.message) {
        <ion-toast
          [isOpen]="true"
          [message]="noti.message"
          [color]="noti.noti_type"
          [duration]="2000"
        ></ion-toast>
      }
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
    <ion-footer>
      <ion-toolbar>
        <ion-title> Footer </ion-title>
      </ion-toolbar>
    </ion-footer>
  </div>
</ion-app>
