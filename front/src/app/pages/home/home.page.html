<ion-grid>
  <ion-row>
    <ion-col size="12" size-sm="3">
      <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" />

      <ion-button expand="block" (click)="fileInput.click()">
        <ion-icon name="image-outline" slot="start"></ion-icon>
        Seleccionar Imagen
      </ion-button>

      <!-- Mostrar si hay un archivo seleccionado -->
      @if (selectedFileName()) {
        <ion-card>
          <ion-card-content>
            <p><strong>Archivo:</strong> {{ selectedFileName() }}</p>

            @if (previewUrl()) {
              <div style="margin-top: 15px; text-align: center">
                <img
                  [src]="previewUrl()"
                  alt="Vista previa"
                  style="
                    max-width: 100%;
                    max-height: 250px;
                    border-radius: 8px;
                    object-fit: contain;
                  "
                />
              </div>
            }
          </ion-card-content>
        </ion-card>
      }
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col>
      @if (fileToUpload()) {
        <ion-button
          expand="block"
          color="success"
          [disabled]="isUploading()"
          (click)="uploadImage()"
          style="margin-top: 20px"
        >
          @if (isUploading()) {
            <ion-spinner name="crescent" slot="start"></ion-spinner>
            Subiendo...
          } @else {
            <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
            Subir al servidor
          }
        </ion-button>
      }
    </ion-col>
  </ion-row>
</ion-grid>
